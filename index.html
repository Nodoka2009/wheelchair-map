<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MichiSAT - バリアフリーマップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e2e8f0; }
        
        /* 地図を画面いっぱいに */
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* UIパネルの共通設定（地図の上に浮く） */
        .ui-panel { position: absolute; z-index: 1000; background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }

        /* 左上のヘッダー＆検索バー */
        .top-left-panel { top: 16px; left: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; width: 320px; max-width: calc(100vw - 32px); }
        .app-title { margin: 0; font-size: 18px; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .search-box { display: flex; gap: 6px; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; }
        .search-box button { padding: 8px 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status-msg { font-size: 12px; color: #64748b; }

        /* 左下の表示設定（コンパクト） */
        .bottom-left-panel { bottom: 24px; left: 16px; padding: 12px 16px; width: 220px; }
        .bottom-left-panel h2 { margin: 0 0 8px; font-size: 14px; color: #334155; }
        .filter-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
        .filter-list label { cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* 右側のルート情報（最初は隠す） */
        .info-panel { top: 16px; right: 16px; width: 340px; max-height: calc(100vh - 32px); max-width: calc(100vw - 32px); padding: 16px; display: none; flex-direction: column; overflow: hidden; }
        .info-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .info-panel-header h2 { margin: 0; font-size: 16px; color: #0f172a; }
        .close-btn { background: #f1f5f9; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; color: #64748b; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: #e2e8f0; }
        #route-info-container { overflow-y: auto; padding-right: 4px; }

        /* モバイル対応 */
        @media (max-width: 600px) {
            .bottom-left-panel { bottom: 24px; left: 16px; width: auto; }
            .info-panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-width: 100%; border-radius: 20px 20px 0 0; max-height: 60vh; }
        }
        /* サイドバーのカード用スタイル */
.record-card {
    cursor: pointer;
    transition: all 0.3s ease;
}

/* 強調された時のスタイル */
.record-card.highlighted {
    border: 2px solid #3b82f6 !important;
    background-color: #eff6ff !important;
    transform: scale(1.02);
}
    </style>
</head>
<body>

<div id="map"></div>

<!-- 左上：ヘッダー＆検索 -->
<div class="ui-panel top-left-panel">
    <h1 class="app-title">♿ MichiSAT</h1>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="場所を検索...">
        <button id="search-btn">🔍</button>
    </div>
    <div id="status-msg">⏳ データを読み込み中...</div>
</div>

<!-- 左下：表示設定 -->
<div class="ui-panel bottom-left-panel">
    <h2>⚙️ 表示設定</h2>
    
    <div style="margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0;">
        <div style="font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: bold;">🎨 色分けの基準</div>
        <select id="color-mode-select" style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; outline: none; background: #f8fafc; cursor: pointer;">
            <option value="wheelchair">車いすの種類別</option>
            <option value="vibration">振動の激しさ（ガタガタ度）</option>
        </select>
    </div>

    <div class="filter-list">
        <label><input type="checkbox" class="filter-cb" value="cat_electric" checked> 🟦 電動車いす</label>
        <label><input type="checkbox" class="filter-cb" value="cat_manual_no_assist" checked> 🟩 自走式（介助なし）</label>
        <label><input type="checkbox" class="filter-cb" value="cat_manual_assist" checked> 🟨 自走式（介助あり）</label>
        <label><input type="checkbox" class="filter-cb" value="cat_caregiver" checked> 🟪 介助用</label>
        <!-- ★ ここに「その他」を追加しました -->
        <label><input type="checkbox" class="filter-cb" value="cat_other" checked> ⬜ その他（ベビーカー等）</label>
    </div>
</div>

<!-- 右側（スマホなら下）：ルート情報 -->
<div class="ui-panel info-panel" id="info-panel">
    <div class="info-panel-header">
        <h2>📍 ルート詳細</h2>
        <button class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">✕</button>
    </div>
    <div id="route-info-container"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web-map.js"></script>
</body>
</html>
