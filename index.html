<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みんなのバリアフリーマップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #334155; background: #f8fafc; }
        header { max-width: 1200px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        h1 { margin: 0; font-size: 22px; color: #0f172a; }
        #status-msg { font-size: 13px; color: #64748b; }
        .main-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
        #map { flex: 7; height: 600px; min-height: 400px; border-radius: 14px; border: 1px solid #cbd5e1; background: #e2e8f0; }
        .sidebar { flex: 3; background: white; padding: 20px; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
        .sidebar h2 { font-size: 16px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }
        .form-group { margin-bottom: 16px; }
        .btn { padding: 4px 8px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; font-weight: bold; cursor: pointer; font-size: 12px; color: #475569; }
        .btn:hover { background: #f8fafc; }
        .info-item { margin-bottom: 12px; }
        .info-label { font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 2px; }
        .info-value { font-size: 14px; color: #0f172a; word-break: break-word; }
        .empty-message { color: #94a3b8; font-size: 13px; line-height: 1.7; }
        @media (max-width: 800px) {
            body { padding: 12px; }
            header { flex-direction: column; align-items: flex-start; }
            .main-container { flex-direction: column; }
            #map { height: 400px; }
        }
    </style>
</head>
<body>

<header>
    <h1>♿ みんなで作るバリアフリーマップ</h1>
    
    <!-- メッセージと検索バーを横に並べる -->
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div id="status-msg">⏳ データを読み込み中...</div>
        
        <!-- ★ ここに検索バーを移動！ -->
        <div style="display: flex; gap: 4px;">
            <input type="text" id="search-input" placeholder="地名・駅名で検索..." style="padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 13px; width: 150px;">
            <button id="search-btn" style="padding: 6px 10px; cursor: pointer; border: none; background-color: #3b82f6; color: white; border-radius: 6px; font-size: 13px;">🔍</button>
        </div>
    </div>
</header>

<div class="main-container">
    <div id="map"></div>
    
    <div class="sidebar">
        <!-- ★ 表示設定（不要なチェックボックスを削除） -->
        <h2>⚙️ 表示設定</h2>
        <div class="form-group" style="margin-bottom: 20px;">
            <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                <button type="button" id="btn-select-all" class="btn">すべて表示</button>
                <button type="button" id="btn-reset-filter" class="btn">すべて隠す</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
                <label style="cursor: pointer;"><input type="checkbox" class="filter-cb" value="cat_electric" checked> 🟦 電動車いす</label>
                <label style="cursor: pointer;"><input type="checkbox" class="filter-cb" value="cat_manual_no_assist" checked> 🟩 自走式（介助なし）</label>
                <label style="cursor: pointer;"><input type="checkbox" class="filter-cb" value="cat_manual_assist" checked> 🟨 自走式（介助あり）</label>
                <label style="cursor: pointer;"><input type="checkbox" class="filter-cb" value="cat_caregiver" checked> 🟪 介助用</label>
            </div>
        </div>

        <h2>📍 ルート情報</h2>
        <div class="empty-message" id="empty-message">
            地図上のルートをクリックすると<br>詳細情報が表示されます。
        </div>
        <div class="info-item"><div class="info-label">投稿ファイル</div><div class="info-value" id="info-filename">-</div></div>
        <div class="info-item"><div class="info-label">日時</div><div class="info-value" id="info-datetime">-</div></div>
        <div class="info-item"><div class="info-label">距離</div><div class="info-value" id="info-distance">-</div></div>
        <div class="info-item"><div class="info-label">天気</div><div class="info-value" id="info-weather">-</div></div>
        <div class="info-item"><div class="info-label">車いすの種類</div><div class="info-value" id="info-wheelchair">-</div></div>
        <div class="info-item"><div class="info-label">介助の有無</div><div class="info-value" id="info-assistance">-</div></div>
        <div class="info-item"><div class="info-label">メモ</div><div class="info-value" id="info-memo">-</div></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web-map.js"></script>
</body>
</html>
