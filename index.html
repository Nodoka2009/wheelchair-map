<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>みんなのバリアフリーマップ</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #334155;
            background: #f8fafc;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #0f172a;
        }

        #status-msg {
            font-size: 13px;
            color: #64748b;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }

        #map {
            flex: 7;
            height: 600px;
            min-height: 400px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            overflow: hidden;
            background: #e2e8f0;
        }

        .sidebar {
            flex: 3;
            background: white;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .sidebar h2 {
            font-size: 16px;
            margin: 0 0 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            color: #0f172a;
        }

        .info-item {
            margin-bottom: 16px;
        }

        .info-label {
            margin-bottom: 3px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
        }

        .info-value {
            font-size: 14px;
            color: #0f172a;
            word-break: break-word;
        }

        .empty-message {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
        }

        @media (max-width: 800px) {
            body {
                padding: 12px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .main-container {
                flex-direction: column;
            }

            #map {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>♿ みんなで作るバリアフリーマップ</h1>
    <div id="status-msg">⏳ データを読み込み中...</div>
</header>

<div class="main-container">

    <div id="map"></div>

    <div class="sidebar">

        <h2>📍 選択中のルート</h2>

        <div class="empty-message" id="empty-message">
            地図上のルートをクリックすると<br>
            詳細情報が表示されます。
        </div>

        <div class="info-item">
            <div class="info-label">投稿ファイル</div>
            <div class="info-value" id="info-filename">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">日時</div>
            <div class="info-value" id="info-datetime">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">距離</div>
            <div class="info-value" id="info-distance">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">天気</div>
            <div class="info-value" id="info-weather">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">車いすの種類</div>
            <div class="info-value" id="info-wheelchair">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">介助の有無</div>
            <div class="info-value" id="info-assistance">-</div>
        </div>

        <div class="info-item">
            <div class="info-label">メモ</div>
            <div class="info-value" id="info-memo">-</div>
        </div>

    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 自分のJS -->
<script src="web-map.js"></script>

</body>
</html>
